<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eeebe2" />
    <title>badjuice · Nox Fortes</title>
    <meta name="description" content="Nox Fortes (badjuice) on GitHub: small tools in C#, PowerShell, JavaScript and Python, and TximTxom, a card game for the browser." />
    <link rel="preload" href="fonts/roboto-mono.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23080909'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' text-anchor='middle' fill='%23eeebe2'%3Ebj%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="page">
      <header class="top">
        <a class="logo" href="#" aria-label="badjuice, home">
          <svg class="logo-icon" viewBox="0 0 40 26" aria-hidden="true">
            <rect x="1" y="1" width="38" height="24" rx="4" />
            <g class="keys">
              <rect x="6" y="6" width="4" height="4" rx="1" /><rect x="12" y="6" width="4" height="4" rx="1" /><rect x="18" y="6" width="4" height="4" rx="1" /><rect x="24" y="6" width="4" height="4" rx="1" /><rect x="30" y="6" width="4" height="4" rx="1" />
              <rect x="6" y="12" width="4" height="4" rx="1" /><rect x="12" y="12" width="4" height="4" rx="1" /><rect x="18" y="12" width="4" height="4" rx="1" /><rect x="24" y="12" width="4" height="4" rx="1" /><rect x="30" y="12" width="4" height="4" rx="1" />
              <rect x="12" y="18" width="16" height="3" rx="1" />
            </g>
          </svg>
          <span class="logo-text"><span class="logo-top">nox fortes</span>badjuice</span>
        </a>
        <nav class="nav" aria-label="Sections">
          <a class="nav-item nav-red" href="#type" title="type the bio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18v12H3z M6 9h2 M10 9h2 M14 9h2 M18 9h0 M6 12h2 M10 12h2 M14 12h2 M8 15h8" /></svg>
            <span>about</span>
          </a>
          <a class="nav-item" href="#projects" title="projects">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" /></svg>
            <span>projects</span>
          </a>
          <a class="nav-item nav-green" href="https://badjuice.github.io/tximtxom/" title="play TximTxom">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4h8l2 2v14H7z M10 9l3 2-3 2z" /></svg>
            <span>play</span>
          </a>
          <a class="nav-item nav-beige" href="https://github.com/badjuice" title="github profile">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" /><path d="M4 21c1-4 4.5-6 8-6s7 2 8 6" /></svg>
            <span>github</span>
          </a>
        </nav>
      </header>

      <main>
        <section id="type" class="test" aria-label="About me">
          <div class="test-meta">
            <span id="mode" class="mode">watching</span>
            <span id="live" class="live" aria-hidden="true"></span>
          </div>
          <p class="sr-only" id="bio-text"></p>
          <div id="words" class="words" aria-hidden="true"></div>
          <p class="hint" id="hint">press any key to type it yourself</p>
          <div id="result" class="result" hidden>
            <div class="stat"><span class="label">wpm</span><span class="big" id="r-wpm">0</span></div>
            <div class="stat"><span class="label">acc</span><span class="big" id="r-acc">0%</span></div>
            <div class="stat"><span class="label">time</span><span class="mid" id="r-time">0s</span></div>
            <div class="stat"><span class="label">characters</span><span class="mid" id="r-chars">0</span></div>
          </div>
        </section>

        <section class="stats" aria-label="GitHub numbers">
          <div class="stat"><span class="label">repos</span><span class="big" id="s-repos">·</span></div>
          <div class="stat"><span class="label">stars</span><span class="big" id="s-stars">·</span></div>
          <div class="stat"><span class="label">followers</span><span class="big" id="s-followers">·</span></div>
          <div class="stat"><span class="label">years on github</span><span class="big" id="s-years">·</span></div>
          <div class="stat"><span class="label">location</span><span class="mid" id="s-location">·</span></div>
        </section>

        <section id="projects" class="projects" aria-label="Projects">
          <div class="config" role="toolbar" aria-label="Filter by language" id="filters"></div>
          <div class="cards" id="cards"><p class="sub">loading projects…</p></div>
        </section>
      </main>

      <footer class="bottom">
        <div class="keytips">
          <span><kbd>any key</kbd> type the bio</span>
          <span><kbd>tab</kbd> + <kbd>enter</kbd> restart</span>
          <span><kbd>esc</kbd> stop</span>
        </div>
        <div class="footer-links">
          <a href="https://github.com/badjuice">github</a>
          <span class="sub">theme: 9009, from <a href="https://monkeytype.com">monkeytype</a></span>
        </div>
      </footer>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
